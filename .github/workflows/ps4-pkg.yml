name: PS4 Homebrew Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "assets/**"
      - "config/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/ps4-pkg.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DOTNET_ROLL_FORWARD: Major
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld make curl jq librsvg2-bin libicu70

      - name: Test patch compatibility guard
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/patch_catalog_test.cpp app/patch_catalog.cpp -o /tmp/patch_catalog_test
          /tmp/patch_catalog_test

      - name: Install .NET runtime for package utility
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Download pinned OpenOrbis toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain_dir="$RUNNER_TEMP/openorbis"
          mkdir -p "$toolchain_dir"
          archive="$RUNNER_TEMP/toolchain-llvm-18.tar.gz"
          url="https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz"
          curl -fL "$url" -o "$archive"
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$toolchain_dir"
          toolchain_root="$(find "$toolchain_dir" -type f -name link.x -printf '%h\n' | head -n 1)"
          if [ -z "$toolchain_root" ] || [ ! -x "$toolchain_root/bin/linux/create-fself" ]; then
            echo "::error::OpenOrbis toolchain extraction is incomplete."
            find "$toolchain_dir" -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          if [ ! -f "$toolchain_root/samples/_common/graphics.cpp" ]; then
            git clone --depth 1 --branch v0.5.4 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git "$RUNNER_TEMP/openorbis-source"
            mkdir -p "$toolchain_root/samples"
            cp -a "$RUNNER_TEMP/openorbis-source/samples/_common" "$toolchain_root/samples/"
          fi
          echo "OO_PS4_TOOLCHAIN=$toolchain_root" >> "$GITHUB_ENV"
          echo "$toolchain_root/bin/linux" >> "$GITHUB_PATH"

      - name: Generate PS4 icon
        run: |
          mkdir -p sce_sys/about
          rsvg-convert -w 512 -h 512 assets/icon.svg -o sce_sys/icon0.png
          identify -format '%wx%h' sce_sys/icon0.png | grep -qx '512x512'

      - name: Validate package identifiers
        run: |
          test "IV0000-GTAD00001_00-GTAVIPATCHDOWNLD" = "$(printf '%s' 'IV0000-GTAD00001_00-GTAVIPATCHDOWNLD' | tr '[:lower:]' '[:upper:]')"

      - name: Build PS4 PKG
        run: make

      - name: Verify package output
        run: |
          test -s "IV0000-GTAD00001_00-GTAVIPATCHDOWNLD.pkg"
          file "IV0000-GTAD00001_00-GTAVIPATCHDOWNLD.pkg"

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: GTA-VI-PATCH-DOWNLOADED-PKG
          path: "IV0000-GTAD00001_00-GTAVIPATCHDOWNLD.pkg"
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct-download GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.2 "IV0000-GTAD00001_00-GTAVIPATCHDOWNLD.pkg" \
            --title "GTA VI - PATCH DOWNLOADED v1.1.2" \
            --notes "PS4 homebrew patch-information viewer. Uses uppercase package Content ID metadata to address the prior install rejection. The listed PPSA29660 content is PS5-only and cannot be installed on PS4. No game or patch payload is downloaded."
